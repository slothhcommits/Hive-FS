syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

// master message type range is 101 - 150
message Master {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;

    // chunkserver message types
    MESSAGE_TYPE_HEARTBEAT_RES = 101;
    MESSAGE_TYPE_UPDATE_VERSION = 102;
    MESSAGE_TYPE_TAKE_LEASE = 103;
    MESSAGE_TYPE_REVOKE_LEASE = 104;
    MESSAGE_TYPE_LOCAL_COPY_CHUNK = 105;
    MESSAGE_TYPE_REPLICATE_CHUNK = 106;
    MESSAGE_TYPE_DELETE_CHUNK = 107;

    // client message types
    MESSAGE_TYPE_FILE = 126;
    MESSAGE_TYPE_CHUNK_REPLICAS = 127;
    MESSAGE_TYPE_SUBTREE = 128;
  }

  // chunkserver messages

  message HeartbeatRes {
    repeated uint64 delete = 1;
    repeated uint64 extend_lease = 2;
    repeated uint64 revoke_lease = 3;
    repeated UpdateVersion update_version = 4;
  }

  message GrantLease {
    uint64 id = 1;
  }

  message RevokeLease {
    repeated uint64 handles = 1;
  }

  message UpdateVersion {
    uint64 id = 1;
    uint32 version = 2;
  }

  message LocalCopy {
    uint64 src_id = 1;
    uint64 dst_id = 2;
  }

  message Replicate {
    uint64 handle = 1;
    uint32 version = 2;
    string src = 3;
  }

  message DeleteChunk {
    uint64 handle = 1;
  }

  // client messages

  message File {
    repeated Master.Chunk chunks = 1;
  }

  message Chunk {
    uint64 chunk_id = 1;
    uint32 version = 2;
    string primary = 3;
    int64 lease_expiry = 4;
    repeated string locations = 5;
  }

  message Subtree {
    repeated string contents = 1;
  }

  // op log

  message Log {
    repeated OperationRec recs = 1;
  }

  message OperationRec {
    uint32 op_type = 1;
    repeated string args = 2;
  }

  message NamespaceRec {
    string path = 1;
    bool dir = 2;
    Metadata metadata = 3;
    message Metadata {
      repeated uint64 chunk_handles = 1;
    }
  }

  message DeletedRec {
    string key = 1;
    int64 deleted_at = 2;
    bool dir = 3;
    repeated uint64 chunk_handles = 4;
  }

  message ChunktableRec {
    uint64 handle = 1;
    Chunk chunk = 2;
    message Chunk {
      uint32 ref = 1;
      uint32 version = 2;
      uint32 rep_factor = 3;
    }
  }
}
