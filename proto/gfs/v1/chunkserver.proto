syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

// chunkserver message range is 51 - 100
message Chunkserver {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;

    // master message types
    MESSAGE_TYPE_HEARTBEAT = 51;

    // client message types

    // chunkserver message types
    MESSAGE_TYPE_PING = 91;
    MESSAGE_TYPE_DATA_STREAM = 92;
    MESSAGE_TYPE_REPLICATE_CHUNK = 93;
  }

  // master messages
  message ChunkInfo {
    uint64 id = 1;
    uint32 version = 2;
    bool extend_lease = 3;
  }

  message Heartbeat {
    string addr = 1;
    uint32 disk_util = 2;
    repeated ChunkInfo chunks = 3;
  }

  // client messages
  message StreamFailed {
  	uint32 seq_id = 1;
   	uint64 chunk_id = 2;
    string error = 3;
  }
}
