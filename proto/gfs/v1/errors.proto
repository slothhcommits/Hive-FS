syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

message Error {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    MESSAGE_TYPE_ERROR = 199;
  }

  enum Code {
    CODE_UNSPECIFIED = 0;

    // shared 151 - 200
    CODE_UNMARSHAL_FAILED = 151;

    // client 1 - 50
    CODE_CREATE_FILE_FAILED = 1;
    CODE_LOOKUP_FAILED = 2;
    CODE_LENGTH_EXCEEDED = 3;
    CODE_CHUNKSERVERS_UNAVAILABLE = 4;
    CODE_LEASE_GRANT_FAILED = 5;
    CODE_SNAPSHOT_FAILED = 6;
  }

  Code code = 1;
  string message = 2;
}
