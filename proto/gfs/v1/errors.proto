syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

message Error {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    MESSAGE_TYPE_ERROR = 199;
  }

  enum Code {
    CODE_UNSPECIFIED = 0;

    // shared 151 - 160
    CODE_UNMARSHAL_FAILED = 151;
    CODE_OP_FAILED = 152;

    // chunkserver
    CODE_CHUNKSERVER_BUSY = 153;
    CODE_CHUNKSERVER_STREAM_FAILED = 154;
    CODE_CHUNKSERVER_CHUNK_UNAVAILABLE = 155;
    CODE_CHUNKSERVER_LEASE_UNAVAILABLE = 156;
  }

  Code code = 1;
  string message = 2;
}
