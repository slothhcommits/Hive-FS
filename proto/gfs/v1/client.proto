syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

// client message type range is 1 - 50
message Client {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;

    // master message types
    MESSAGE_TYPE_READ_FILE = 1;
    MESSAGE_TYPE_CREATE_FILE = 2;
    MESSAGE_TYPE_CHUNK_REPLICAS = 3;
    MESSAGE_TYPE_SNAPSHOT = 5;
    MESSAGE_TYPE_MOVE = 6;
    MESSAGE_TYPE_LIST = 7;
    MESSAGE_TYPE_DELETE = 8;

    // chunkserver message types
    MESSAGE_TYPE_DATA_STREAM = 26;
    MESSAGE_TYPE_COMMIT_WRITE = 27;
  }

  // master messages
  message Read {
    string path = 1;
    uint32 idx = 2;
    uint32 count = 3;
  }

  message CreateFile {
    string path = 1;
  }

  message GetChunkReplicas {
    string path = 1;
    bool last_chunk = 2;
    uint32 chunk_idx = 3;
  }

  message Snapshot {
    string src = 1;
    string dst = 2;
  }

  message Move {
    string src = 1;
    string dst = 2;
  }

  message List {
    string path = 1;
  }

  message Delete {
    string path = 1;
  }

  // chunkserver messages
  message StreamHeader {
    uint32 seq_id = 1;
    uint64 chunk_id = 2;
    string client_listen_addr = 3;
    repeated string locations = 4;
  }
}
