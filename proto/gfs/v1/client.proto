syntax = "proto3";

package gfs.v1;

option go_package = "github.com/PraveenC2002/gfs/internal/messages;messages";

// client message type range is 1 - 50
message Client {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;

    // master message types
    MESSAGE_TYPE_CREATE_REQ = 1;
    MESSAGE_TYPE_GET_CHUNK_REPLICAS_REQ = 2;
    MESSAGE_TYPE_SNAPSHOT_REQ = 3;
    MESSAGE_TYPE_OP_ACK = 4;

    // chunkserver message types
  }
}

// master messages

message ClientOpAck {
  bool success = 1;
}

message Create {
  string path = 1;
}

message GetChunkReplicas {
  string path = 1;
  uint32 chunk_idx = 2;
}

message Snapshot {
  string src = 1;
  string dst = 2;
}
