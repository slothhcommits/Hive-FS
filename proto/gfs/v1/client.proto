syntax = "proto3";

package gfs.v1;

option go_package = "github.com/slothhcommits/Hive-FS/internal/messages;messages";

// client message type range is 1 - 50
message Client {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;

    // master message types
    MESSAGE_TYPE_CREATE_FILE = 1;
    MESSAGE_TYPE_READ_FILE = 2;
    MESSAGE_TYPE_CHUNK_REPLICAS = 3;
    MESSAGE_TYPE_SNAPSHOT = 5;
    MESSAGE_TYPE_MOVE = 6;
    MESSAGE_TYPE_LIST = 7;
    MESSAGE_TYPE_DELETE = 8;

    // chunkserver message types
    MESSAGE_TYPE_READ_STREAM = 26;
    MESSAGE_TYPE_WRITE_DATA_STREAM = 27;
    MESSAGE_TYPE_COMMIT_WRITE = 28;
  }

  // master messages

  message CreateFile {
    string path = 1;
  }

  message Read {
    string path = 1;
    uint32 idx = 2;
    uint32 count = 3;
  }

  message GetChunkReplicas {
    string path = 1;
    bool last_chunk = 2;
    uint32 chunk_idx = 3;
  }

  message Snapshot {
    string src = 1;
    string dst = 2;
  }

  message Move {
    string src = 1;
    string dst = 2;
  }

  message List {
    string path = 1;
  }

  message Delete {
    string path = 1;
  }

  // chunkserver messages

  message ReadStreamMetadata {
    uint64 chunk_id = 1;
    uint32 version = 2;
    int64 offset = 3;
    uint32 length = 4;
  }

  message WriteStreamMetadata {
    uint32 buffer_id = 1;
    uint64 chunk_id = 2;
    int64 offset = 3;
    uint32 size = 4;
    string origin_addr = 5;
    string peer_addr = 6;
    repeated string forward_list = 7;
  }

  message Write {
    uint32 buffer_id = 1;
    uint64 chunk_id = 2;
    int64 offset = 3;
    repeated string secondaries = 4;
  }

  message WriteAck {
    int64 offset = 1;
  }
}
